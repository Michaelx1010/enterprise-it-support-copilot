name: it-support-kb
services:
  db:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.1-pg17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_support}
      POSTGRES_USER: ${POSTGRES_USER:-it_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - kb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  kb_data:
    name: ${KB_VOLUME_NAME:-it-support-kb-data}
